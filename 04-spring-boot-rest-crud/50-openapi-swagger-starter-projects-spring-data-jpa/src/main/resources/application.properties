spring.application.name=cruddemo

#
# MVC path matching - required for SpringDoc /swagger-ui/**/*swagger-initializer.js pattern
#
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
#
# JDBC properties
#
spring.datasource.url=jdbc:mysql://localhost:3306/employee_directory
spring.datasource.username=springstudent
spring.datasource.password=springstudent

#
# Spring Data REST properties
#
spring.data.rest.base-path=/magic-api
spring.data.rest.default-page-size=20
springdoc.enable-data-rest=true
#springdoc.api-docs.version=openapi_3_0

# configure custom path
# springdoc.swagger-ui.path=/my-ui.html

# configure custom path for api docs
# springdoc.api-docs.path=/my-api-docs