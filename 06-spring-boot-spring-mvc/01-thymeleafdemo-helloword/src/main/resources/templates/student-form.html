<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registered Form</title>
</head>
<body>
    <h3>Student Registration Form</h3>

    <form th:action="@{/processStudentForm}" th:object="${student}" method="POST">
        First name: <input type="text" th:field="*{firstName}" />

        <br><br>

        Last name: <input type="text" th:field="*{lastName}" />

        <br><br>

        Country:
        <select th:field="*{country}">
            <option th:each="tempCountry : ${countries}" th:value="${tempCountry}" th:text="${tempCountry}" />
        </select>

        <br><br>

        Favorite Programming Language:

        <input type="radio"
               th:field="*{favoriteLanguage}"
               th:each="tempFavoriteLanguage : ${favoriteLanguages}"
               th:text="${tempFavoriteLanguage}"
               th:value="${tempFavoriteLanguage}" />

        <br><br>

        <input type="checkbox"
               th:field="*{favoriteSystems}"
               th:each="tempSystem : ${favoriteSystems}"
               th:value="${tempSystem}"
               th:text="${tempSystem}"
        />

        <br><br>

        <input type="submit" value="Submit" />
    </form>
</body>
</html>
